name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript and Astro content
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Build static site
        run: npm run build

      - name: Validate Cloudflare static assets configuration
        run: npm run cf:check

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e
