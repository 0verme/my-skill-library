name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Skill and Prompt schema compatibility
        run: npm run test:schema

      - name: Verify Worker admin authentication and safety
        run: npm run test:worker

      - name: Verify secure GitHub Skill import parsing and limits
        run: npm run test:import

      - name: Verify visual editor drafts, provenance and conflict protections
        run: npm run test:editor

      - name: Check TypeScript and Astro content
        run: npm run check

      - name: Check formatting
        run: npm run format:check

      - name: Build static site
        run: npm run build

      - name: Validate canonical, Open Graph, sitemap and robots domains
        run: npm run test:seo

      - name: Validate Cloudflare static assets configuration
        run: npm run cf:check

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        run: npm run test:e2e

      # PRs validate only; deployment runs solely on a successful push to main.
      # dist/ is built earlier in this job, so no artifact download is necessary.
      - name: Deploy Cloudflare Worker
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: 0verme/ci-workflows/.github/actions/cloudflare-worker-deploy@v1
        with:
          working_directory: .
          api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
